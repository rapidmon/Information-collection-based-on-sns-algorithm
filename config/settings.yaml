app:
  name: "SNS Tech Briefing"
  timezone: "Asia/Seoul"

collection:
  max_age_days: 2  # 게시일 N일 초과 게시물은 수집 단계에서 제외
  twitter:
    enabled: true
    interval_minutes: 20
    scroll_rounds: 5          # 필터 호출당 브리핑 산출 최저(0.14)라 감축. baseline은 여전히 충분
    scroll_delay_min: 2.0
    scroll_delay_max: 4.0
    use_graphql_interception: true
  threads:
    enabled: true
    interval_minutes: 20
    scroll_rounds: 3          # 전체 필터의 57%·관련도 7.7%라 볼륨을 절반으로 (토큰 절감)
    scroll_delay_min: 2.5
    scroll_delay_max: 5.0
  linkedin:
    enabled: true
    interval_minutes: 20
    scroll_rounds: 8
    scroll_delay_min: 3.0
    scroll_delay_max: 7.0
  dcinside:
    enabled: true
    interval_minutes: 60
    gallery_id: "thesingularity"
    gallery_type: "mgallery"
    pages_to_scrape: 3
    request_delay_min: 1.5
    request_delay_max: 3.0
  36kr:
    enabled: true
    interval_minutes: 30   # 중국 산업/AI/개발 뉴스플래시 (HTTP, 로그인 불필요)
  producthunt:
    enabled: true
    interval_minutes: 120  # AI 제품 런칭·쇼케이스 (Atom RSS, 로그인 불필요)
  news:
    enabled: true
    interval_minutes: 60   # 외신·AI 기업 1차 소스 RSS (HTTP, 로그인 불필요)
    max_items_per_feed: 30
    # tier — official: 정식 tech 매체(추후 보도폭 가산 대상) / paywalled: 페이월 헤드라인·재인용만
    #        primary: AI 기업 1차 소스. 페이월·RSS 없는 곳은 Google News RSS 프록시로 헤드라인만 수집.
    feeds:
      - { name: "TechCrunch", tier: official, url: "https://techcrunch.com/feed/" }
      - { name: "The Verge", tier: official, url: "https://www.theverge.com/rss/index.xml" }
      - { name: "Platformer", tier: official, url: "https://www.platformer.news/rss/" }
      - { name: "Semafor", tier: official, url: "https://news.google.com/rss/search?q=site:semafor.com/article%20when:2d%20(AI%20OR%20tech%20OR%20technology)&hl=en-US&gl=US&ceid=US:en" }
      - { name: "Hugging Face Blog", tier: official, url: "https://huggingface.co/blog/feed.xml" }
      - { name: "The Information", tier: paywalled, url: "https://news.google.com/rss/search?q=site:theinformation.com%20when:2d&hl=en-US&gl=US&ceid=US:en" }
      - { name: "Bloomberg", tier: paywalled, url: "https://news.google.com/rss/search?q=site:bloomberg.com%20when:2d%20(AI%20OR%20tech)&hl=en-US&gl=US&ceid=US:en" }
      - { name: "Wired", tier: paywalled, url: "https://news.google.com/rss/search?q=site:wired.com%20when:2d&hl=en-US&gl=US&ceid=US:en" }
      - { name: "OpenAI", tier: primary, url: "https://openai.com/news/rss.xml" }
      - { name: "Anthropic", tier: primary, url: "https://news.google.com/rss/search?q=site:anthropic.com%20when:7d&hl=en-US&gl=US&ceid=US:en" }
      - { name: "Google DeepMind", tier: primary, url: "https://deepmind.google/blog/rss.xml" }
      - { name: "Meta AI", tier: primary, url: "https://news.google.com/rss/search?q=site:ai.meta.com%20when:7d&hl=en-US&gl=US&ceid=US:en" }
      - { name: "xAI", tier: primary, url: "https://news.google.com/rss/search?q=site:x.ai%20when:7d&hl=en-US&gl=US&ceid=US:en" }

categories:
  - name: "AI"
    name_ko: "AI"
    color: "#4A90D9"
    keywords: ["AI", "인공지능", "LLM", "GPT", "Claude", "Gemini", "딥러닝", "머신러닝", "OpenAI", "Anthropic", "생성AI"]
  - name: "Semiconductor"
    name_ko: "반도체"
    color: "#E74C3C"
    keywords: ["반도체", "semiconductor", "칩", "chip", "TSMC", "삼성파운드리", "HBM", "GPU", "NVIDIA", "AMD", "Intel", "파운드리"]
  - name: "Cloud"
    name_ko: "클라우드·인프라"
    color: "#2ECC71"
    keywords: ["클라우드", "cloud", "AWS", "Azure", "GCP", "SaaS", "IaaS", "데이터센터", "data center", "인프라", "추론 서빙", "모델 서빙", "전력", "전력망", "전력기기", "변압기", "냉각", "PUE", "발전"]
  - name: "Startup"
    name_ko: "스타트업"
    color: "#F39C12"
    keywords: ["스타트업", "startup", "투자", "펀딩", "시리즈", "인수", "합병", "M&A", "벤처"]
  - name: "BigTech"
    name_ko: "빅테크"
    color: "#9B59B6"
    keywords: ["Google", "Apple", "Meta", "Amazon", "Microsoft", "ByteDance", "Tencent", "빅테크"]
  - name: "Regulation"
    name_ko: "규제/정책"
    color: "#1ABC9C"
    keywords: ["규제", "정책", "법률", "regulation", "정부", "EU", "AI법", "독점"]
  - name: "Coding"
    name_ko: "코딩"
    color: "#E67E22"
    keywords: ["코딩", "프로그래밍", "개발자", "GitHub", "오픈소스", "Python", "JavaScript", "React", "프레임워크", "API", "DevOps", "CI/CD"]
  - name: "Showcase"
    name_ko: "메이커·쇼케이스"
    color: "#EC4899"
    keywords: ["쇼케이스", "showcase", "만들었", "출시", "런칭", "launch", "데모", "demo", "사이드프로젝트", "side project", "바이브코딩", "vibe coding", "Product Hunt", "v0", "Lovable", "Bolt", "made with", "built with"]

processing:
  claude_model_filter: "claude-haiku-4-5"    # Claude: 고빈도 배치 (필터/분류/검증)
  claude_model_process: "claude-sonnet-4-6"  # 발행 확정분 작문 + 독자군 큐레이션
  # 브리핑 dedup 두 단계 — 7월 사고 이력(23일 recall 붕괴, 24일 precision 붕괴)으로
  # 모델을 독립 키로 분리. 둘 다 하루 1회·소규모 호출이라 한도 영향은 미미하다.
  claude_model_dedup: "claude-opus-4-8"          # 기브리핑 판정 (find_covered_topics)
  claude_model_consolidate: "claude-haiku-4-5"   # 발행 확정분 동일 사건 병합 가드
  claude_timeout: 600
  # 고빈도 배치(필터·분류·검증·기브리핑판정·통합가드) 백엔드:
  #   openai(종량 과금) | claude(정액 구독)
  # claude면 OpenAI 청구액이 ~0으로 가지만 구독 한도(대화형 작업과 공유)를 쓴다.
  # 토큰 절감: 물량 지배 단계인 필터만 추론 끔(호출당 총 등가 −45%, 판정 품질 동일 실측),
  # 품질 민감 단계(중요도 채점·기브리핑 판정·티어)는 추론 유지. 오버헤드는 거의 전부 캐시.
  # ⚠️ 전환 후 최소 1주일 rate limit 체감 관찰. 백엔드 장애 시 openai 자동 폴백.
  routine_backend: "claude"
  model_filter: "gpt-5-mini"          # OpenAI 폴백: 필터/분류/검증 (추론 모델)
  model_process: "gpt-5-mini"         # OpenAI 폴백: 작문·큐레이션 (Claude 실패 시)
  batch_size_filter: 40
  batch_size_categorize: 40
  dedup_chunk_size: 30         # 미사용 (결정적 클러스터링은 청크 개념 없음)
  processing_interval_minutes: 60  # 1시간 모아서 처리 — 배치가 꽉 차 템플릿 반복 비용 감소
  min_posts_to_process: 10

like:
  enabled: true            # 자동 좋아요 사용 여부
  dry_run: false           # false면 실제 추천 클릭. (개별 게시물 URL만 시도 — 프로필/회사 URL은 스킵)
  max_per_run: 10          # 1회(플랫폼당) 최대 좋아요 수
  min_importance: 0.7      # AI 중요도 이 값 이상인 관련 게시물만 좋아요
  delay_min: 2.0           # 좋아요 사이 최소 대기(초)
  delay_max: 5.0           # 좋아요 사이 최대 대기(초)
  platforms: ["twitter", "threads", "linkedin"]

briefing:
  daily_time: "08:00"
  max_items: 0
  include_stats: true
  min_importance: 0.85      # 카테고리별 상대 점수 하한 — 각 카테고리 최고 대비 85% 이상만 포함
  max_per_category: 6       # 카테고리별 최대 항목 수 (한 카테고리 과다 방지)

# 브리핑 중요도 산정 (게시물 AI 중요도 + 인게이지먼트 보조 신호, 카테고리별 정규화 max=1.0)
#  게시물 점수 = (1 - engagement_weight)×AI중요도 + engagement_weight×인게이지먼트백분위
#  병합된 사건은 카테고리별 구성 게시물 점수의 top-3 평균으로 평가하고 대표 카테고리 하나로만 노출
scoring:
  freq_weight: 0.05         # deprecated: 현재 브리핑 점수에는 사용하지 않음
  engagement_weight: 0.2    # 게시물 점수에서 인게이지먼트가 차지하는 비율(0~1)
  tier_bonus:               # deprecated: 현재 브리핑 점수에는 사용하지 않음
    major: 1.0
    notable: 0.4
    minor: 0.0
  w_likes: 1.0              # 인게이지먼트 원점수 가중
  w_reposts: 2.0
  w_comments: 1.5
  category_base: {}         # 사용하지 않음: 카테고리 간 base 보정 대신 카테고리별 상대평가


# 슬랙 브리핑 게시 — 헤더 1개 + 항목별 스레드 댓글, 댓글마다 투표 리액션(👍/👎) 선부착
# 토큰은 .env의 SLACK_BOT_TOKEN (봇 스코프: chat:write, reactions:write / 채널에 봇 초대 필요)
slack:
  enabled: true
  channel: "#디지랩-담당자-소통용"   # 채널명 또는 채널 ID("C0123...")
  reactions: ["+1", "-1"]     # 선부착할 리액션 이모지 이름 (콜론 없이). [0]=찬성, [1]=반대
  # 운영 알림(Claude 토큰 만료 D-7 등) DM 수신자 멤버 ID. 프로필 → ⋮ → '멤버 ID 복사'
  alert_user_id: "U04HPLC134G"           # 예: "U0123ABCDEF". 비우면 DM 알림 꺼짐

  # ─ 투표 마감 → 1위 항목 카드뉴스 타이틀 게시 ─
  vote_close_time: "12:00"    # 집계 실행 시각 (HH:MM)
  vote_days: "mon-fri"        # 집계 실행 요일 (주말은 투표 없음 — @멘션으로 수동 처리)
  winner_websearch: false     # 프롬프트가 '입력된 정보 안에서만' 조건이라 웹검색 불필요
  # 1위 항목에 돌릴 프롬프트. ★비워두면 투표 집계 기능 전체가 꺼짐★
  # 플레이스홀더: {headline} {bullets} {category} {sources} {posts} {date}
  winner_prompt: |
    아래 AI 뉴스 게시물로 인스타 카드뉴스 1장 타이틀을 만들어줘.

    타겟은 AI 툴을 실무에 쓰는 미디어·크리에이티브 직군이야.
    개발자, 디자이너, 마케터, 데이터 엔지니어, PD, 기자 등이 포함돼.

    핵심 판단 기준:
    - 이 뉴스에서 "무엇이 가능해졌는가/무엇이 달라졌는가"를 먼저 찾고, 가장 중요한 변화 1개만 타이틀에 담는다.
    - 건조한 보도자료 톤이 아니라, 놀라움과 변화가 느껴지는 대화체 후킹으로 쓴다. ("~라고?", "~까지 가능", "~시대 시작" 같은 톤)
    - 제목만 봐도 "그래서 뭐가 생겼는지, 왜 놀라운지" 알 수 있어야 한다.
    - 과장하지 말고 입력된 정보 안에서만 쓴다.

    좋은 예시 (이 톤과 길이를 그대로 따라할 것):
    2026 피그마 업데이트: 이제 피그마에서 모션까지 가능하다고?
    Fable 5 얼마나 좋은데? 한 문장으로 게임까지 완성가능
    구글 제미나이 flash 출시 1인 1비서 시대 시작

    나쁜 예시 (이런 건조한 요약 금지):
    2026 피그마 config 업데이트 내용: 에니메이트 기능 발표
    Claude Fable 5 제한 해제, 성능 요약
    구글 제미나이 flash 출시, 컴퓨터 에이전트 구축 확장

    출력 규칙 (반드시 지킬 것):
    - 아래 형식 그대로, 결과물만 출력한다.
    - 인사말·설명·판단 근거·제목 헤더(##)·구분선 등 어떤 사족도 붙이지 않는다.
    - 같은 주제로 서로 다른 방향의 타이틀 2개를 낸다.
    - 타이틀은 한 줄(좋은 예시 길이 수준, 최대 30자). 캡션은 타이틀에서 빠진 기업명/모델명/제공 경로를 보완하는 한 줄.

    1안. [타이틀]
    캡션: [보조 카피]

    2안. [타이틀]
    캡션: [보조 카피]

    입력 게시물:
    """
    제목: {headline}
    카테고리: {category}
    요약:
    {bullets}
    원본 게시물:
    {posts}
    출처:
    {sources}
    """
  # 본문 캡션용 추가 프롬프트 (타이틀 메시지의 스레드에 게시됨)
  caption_prompt: |
    아래 AI 뉴스 게시물로 인스타그램 캡션 본문을 작성해줘.

    ## 채널 정보
    디지랩은 AI 툴을 실무에 활용하는 미디어·크리에이티브 직군을 위한
    인스타그램 인사이트 채널입니다.
    타겟: 개발자, 디자이너, 마케터, 데이터 엔지니어, PD, 기자 등
    최소 조건: 클로드·GPT를 업무에 써본 경험이 있거나, AI를 더 잘 쓰고 싶은 실무자

    ---

    ## 콘텐츠 구성

    **제목** (17자 이내)
    - 형식: "싸고 성능 좋은 건 없다? Gemini 3 Flash는 가능"처럼
      의문 + 반전 구조, 또는 핵심 한 줄 요약
    - 금지: 단순 소식 나열, 영문 번역체

    **부제목** (섹션 구분용)
    - 질문형: "Flash 뭐가 달라졌을까?"
    - 서술형: "보고, 판단하고, 직접 행동하는 AI"
    - 두 형식 중 내용에 맞게 선택

    **본문**
    - 짧고 끊어서 씁니다
    - 이모지로 섹션 구분
    - 섹션은 질문으로 시작
    - 예시는 불릿 리스트로
    - 마지막은 따옴표 공감 후킹으로 마무리
    - 해시태그로 마감

    ---

    ## 문체 기준

    **참고**: 토스 소식지, UX 라이팅 스타일
    **말투**: "합니다 / 해요" 혼용 — 정중하지만 딱딱하지 않게
    **금지**
    - "이미 ~됐습니다" 식 서술
    - 영어를 번역한 것 같은 어투
    - 사양 나열 (수치, 벤치마크만 늘어놓는 방식)
    - 느끼하거나 장황한 표현

    ---

    ## 본문 구조 예시

    (제목)
    이제 Gemini 3.5 Flash가 내 컴퓨터로 직접 일하는 시대

    🖥️ (부제목: 질문형)
    어떤 게 달라질까요?
    클릭, 입력, 화면 전환까지.
    데스크톱부터 모바일, 브라우저까지
    사람이 마우스로 하던 작업을 AI가 대신합니다.

    예를 들면 이런 것들이에요.
    - 반복되는 폼 작성
    - 여러 탭을 오가며 정보 취합
    - 앱 간 데이터 이동

    🙋 (부제목: 서술형 또는 질문형)
    어디서 쓸 수 있나요?
    Gemini API와 Enterprise Agent Platform에서
    지금 바로 사용할 수 있어요.

    "AI가 이 정도는 해줄 수 없나?"라고
    생각만 했던 것들, 이제 정말 가능해집니다.

    출처: (원문 출처)
    #해시태그 #해시태그

    ---

