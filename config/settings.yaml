app:
  name: "SNS Tech Briefing"
  timezone: "Asia/Seoul"

collection:
  max_age_days: 2  # 게시일 N일 초과 게시물은 수집 단계에서 제외
  twitter:
    enabled: true
    interval_minutes: 10
    scroll_rounds: 8
    scroll_delay_min: 2.0
    scroll_delay_max: 4.0
    use_graphql_interception: true
  threads:
    enabled: true
    interval_minutes: 10
    scroll_rounds: 6
    scroll_delay_min: 2.5
    scroll_delay_max: 5.0
  linkedin:
    enabled: true
    interval_minutes: 10
    scroll_rounds: 8
    scroll_delay_min: 3.0
    scroll_delay_max: 7.0
  dcinside:
    enabled: true
    interval_minutes: 60
    gallery_id: "thesingularity"
    gallery_type: "mgallery"
    pages_to_scrape: 3
    request_delay_min: 1.5
    request_delay_max: 3.0
  36kr:
    enabled: true
    interval_minutes: 30   # 중국 산업/AI/개발 뉴스플래시 (HTTP, 로그인 불필요)

categories:
  - name: "AI"
    name_ko: "AI"
    color: "#4A90D9"
    keywords: ["AI", "인공지능", "LLM", "GPT", "Claude", "Gemini", "딥러닝", "머신러닝", "OpenAI", "Anthropic", "생성AI"]
  - name: "Semiconductor"
    name_ko: "반도체"
    color: "#E74C3C"
    keywords: ["반도체", "semiconductor", "칩", "chip", "TSMC", "삼성파운드리", "HBM", "GPU", "NVIDIA", "AMD", "Intel", "파운드리"]
  - name: "Cloud"
    name_ko: "클라우드·인프라"
    color: "#2ECC71"
    keywords: ["클라우드", "cloud", "AWS", "Azure", "GCP", "SaaS", "IaaS", "데이터센터", "data center", "인프라", "추론 서빙", "모델 서빙", "전력", "전력망", "전력기기", "변압기", "냉각", "PUE", "발전"]
  - name: "Startup"
    name_ko: "스타트업"
    color: "#F39C12"
    keywords: ["스타트업", "startup", "투자", "펀딩", "시리즈", "인수", "합병", "M&A", "벤처"]
  - name: "BigTech"
    name_ko: "빅테크"
    color: "#9B59B6"
    keywords: ["Google", "Apple", "Meta", "Amazon", "Microsoft", "ByteDance", "Tencent", "빅테크"]
  - name: "Regulation"
    name_ko: "규제/정책"
    color: "#1ABC9C"
    keywords: ["규제", "정책", "법률", "regulation", "정부", "EU", "AI법", "독점"]
  - name: "Coding"
    name_ko: "코딩"
    color: "#E67E22"
    keywords: ["코딩", "프로그래밍", "개발자", "GitHub", "오픈소스", "Python", "JavaScript", "React", "프레임워크", "API", "DevOps", "CI/CD"]

processing:
  ai_backend: "claude_code"           # "claude_code"(구독, API 키 불필요) 또는 "openai"(API 키)
  claude_model_filter: "claude-haiku-4-5"    # 필터/분류/검증용 (빠르고 저렴)
  claude_model_process: "claude-sonnet-4-6"  # 중복제거/통합용 (정교함). 절약하려면 haiku로
  claude_timeout: 600
  model_filter: "gpt-4o-mini"         # ai_backend=openai 일 때만 사용
  model_process: "gpt-5-mini"         # ai_backend=openai 일 때만 사용
  batch_size_filter: 20
  batch_size_summarize: 15
  batch_size_categorize: 20
  use_batch_api: true
  min_importance_for_briefing: 0.85
  dedup_chunk_size: 30
  processing_interval_minutes: 30
  min_posts_to_process: 10

like:
  enabled: true            # 자동 좋아요 사용 여부
  dry_run: true            # true면 실제로 누르지 않고 버튼 확인 후 "좋아요 대상"만 로그
  max_per_run: 10          # 1회(플랫폼당) 최대 좋아요 수
  min_importance: 0.7      # AI 중요도 이 값 이상인 관련 게시물만 좋아요
  delay_min: 2.0           # 좋아요 사이 최소 대기(초)
  delay_max: 5.0           # 좋아요 사이 최대 대기(초)
  platforms: ["twitter", "threads", "linkedin"]

briefing:
  daily_time: "09:00"
  max_items: 50
  include_stats: true
  min_importance: 0.8       # 병합 후 재산정 점수 하한 (저중요도 항목 제거)
  max_per_category: 8       # 카테고리별 최대 항목 수 (한 카테고리 과다 방지)

email:
  enabled: true
  curation: true                # 독자층별 큐레이션(전체 리드+카테고리 B-2+킥) 생성
  logo_path: "Logo.png"         # 메일 헤더 로고 (cid 임베드)
  subject_prefix: "Morning Commit"
  # 독자층별 발송: 페르소나(=큐레이션 대상) → 수신주소
  audiences:
    "국내 개발자":
      - "ehhwll@hanmail.net"
      - "sbemls@donga.com"
      - "jey_sieun@donga.com"
    "국내 CS 취준생 및 주니어 개발자":
      - "ndbsrjsdn@naver.com"
  # 폴백 (audiences 비울 때만 사용 — 큐레이션 없이 중립 발송)
  to_addresses:
    - "ehhwll@hanmail.net"
    - "ndbsrjsdn@naver.com"

web:
  host: "0.0.0.0"
  port: 8000
  auto_refresh_seconds: 60

browser:
  headless: false
  profile_dir: "browser_data"
