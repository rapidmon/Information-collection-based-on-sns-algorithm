app:
  name: "SNS Tech Briefing"
  timezone: "Asia/Seoul"

collection:
  max_age_days: 2  # 게시일 N일 초과 게시물은 수집 단계에서 제외
  twitter:
    enabled: true
    interval_minutes: 10
    scroll_rounds: 5          # 필터 호출당 브리핑 산출 최저(0.14)라 감축. baseline은 여전히 충분
    scroll_delay_min: 2.0
    scroll_delay_max: 4.0
    use_graphql_interception: true
  threads:
    enabled: true
    interval_minutes: 10
    scroll_rounds: 3          # 전체 필터의 57%·관련도 7.7%라 볼륨을 절반으로 (토큰 절감)
    scroll_delay_min: 2.5
    scroll_delay_max: 5.0
  linkedin:
    enabled: true
    interval_minutes: 10
    scroll_rounds: 8
    scroll_delay_min: 3.0
    scroll_delay_max: 7.0
  dcinside:
    enabled: true
    interval_minutes: 60
    gallery_id: "thesingularity"
    gallery_type: "mgallery"
    pages_to_scrape: 3
    request_delay_min: 1.5
    request_delay_max: 3.0
  36kr:
    enabled: true
    interval_minutes: 30   # 중국 산업/AI/개발 뉴스플래시 (HTTP, 로그인 불필요)
  producthunt:
    enabled: true
    interval_minutes: 120  # AI 제품 런칭·쇼케이스 (Atom RSS, 로그인 불필요)

categories:
  - name: "AI"
    name_ko: "AI"
    color: "#4A90D9"
    keywords: ["AI", "인공지능", "LLM", "GPT", "Claude", "Gemini", "딥러닝", "머신러닝", "OpenAI", "Anthropic", "생성AI"]
  - name: "Semiconductor"
    name_ko: "반도체"
    color: "#E74C3C"
    keywords: ["반도체", "semiconductor", "칩", "chip", "TSMC", "삼성파운드리", "HBM", "GPU", "NVIDIA", "AMD", "Intel", "파운드리"]
  - name: "Cloud"
    name_ko: "클라우드·인프라"
    color: "#2ECC71"
    keywords: ["클라우드", "cloud", "AWS", "Azure", "GCP", "SaaS", "IaaS", "데이터센터", "data center", "인프라", "추론 서빙", "모델 서빙", "전력", "전력망", "전력기기", "변압기", "냉각", "PUE", "발전"]
  - name: "Startup"
    name_ko: "스타트업"
    color: "#F39C12"
    keywords: ["스타트업", "startup", "투자", "펀딩", "시리즈", "인수", "합병", "M&A", "벤처"]
  - name: "BigTech"
    name_ko: "빅테크"
    color: "#9B59B6"
    keywords: ["Google", "Apple", "Meta", "Amazon", "Microsoft", "ByteDance", "Tencent", "빅테크"]
  - name: "Regulation"
    name_ko: "규제/정책"
    color: "#1ABC9C"
    keywords: ["규제", "정책", "법률", "regulation", "정부", "EU", "AI법", "독점"]
  - name: "Coding"
    name_ko: "코딩"
    color: "#E67E22"
    keywords: ["코딩", "프로그래밍", "개발자", "GitHub", "오픈소스", "Python", "JavaScript", "React", "프레임워크", "API", "DevOps", "CI/CD"]
  - name: "Showcase"
    name_ko: "메이커·쇼케이스"
    color: "#EC4899"
    keywords: ["쇼케이스", "showcase", "만들었", "출시", "런칭", "launch", "데모", "demo", "사이드프로젝트", "side project", "바이브코딩", "vibe coding", "Product Hunt", "v0", "Lovable", "Bolt", "made with", "built with"]

processing:
  ai_backend: "claude_code"           # "claude_code"(구독, API 키 불필요) 또는 "openai"(API 키)
  claude_model_filter: "claude-haiku-4-5"    # 필터/분류/검증용 (빠르고 저렴)
  claude_model_process: "claude-sonnet-4-6"  # 중복제거/통합용 (정교함). 절약하려면 haiku로
  claude_timeout: 600
  model_filter: "gpt-4o-mini"         # ai_backend=openai 일 때만 사용
  model_process: "gpt-5-mini"         # ai_backend=openai 일 때만 사용
  batch_size_filter: 40        # 호출당 ~28k CLI 오버헤드가 고정이라 배치를 키워 호출 수를 절반으로
  batch_size_categorize: 40
  dedup_chunk_size: 30
  processing_interval_minutes: 30
  min_posts_to_process: 10

like:
  enabled: true            # 자동 좋아요 사용 여부
  dry_run: false           # false면 실제 추천 클릭. (개별 게시물 URL만 시도 — 프로필/회사 URL은 스킵)
  max_per_run: 10          # 1회(플랫폼당) 최대 좋아요 수
  min_importance: 0.7      # AI 중요도 이 값 이상인 관련 게시물만 좋아요
  delay_min: 2.0           # 좋아요 사이 최소 대기(초)
  delay_max: 5.0           # 좋아요 사이 최대 대기(초)
  platforms: ["twitter", "threads", "linkedin"]

briefing:
  daily_time: "08:00"
  max_items: 50
  include_stats: true
  min_importance: 0.5       # 정규화(최고=1.0) 점수 하한 — 그날 최고 대비 50% 미만 항목 제거
  max_per_category: 6       # 카테고리별 최대 항목 수 (한 카테고리 과다 방지)

# 브리핑 중요도 산정 (객관 신호 + LLM 티어 보정, 정규화 max=1.0)
#  최종 = freq_weight×고유출처수 + engagement_weight×인게이지먼트백분위 + tier_bonus[tier]
#  ※ 사용자 피드백(적절/과대/과소)이 쌓이면 이 가중치를 조정해 캘리브레이션
scoring:
  freq_weight: 0.05         # 고유 출처(계정) 1개당 가점
  engagement_weight: 0.4    # 인게이지먼트 플랫폼별 백분위(0~1)에 곱
  tier_bonus:               # LLM 절대 등급 보정 (조용해도 큰 사건을 끌어올림)
    major: 1.0
    notable: 0.4
    minor: 0.0
  w_likes: 1.0              # 인게이지먼트 원점수 가중
  w_reposts: 2.0
  w_comments: 1.5
  category_base:            # 카테고리별 점수 축 분기: 뉴스 티어가 무의미한 카테고리는
    Showcase: 0.55          # 티어 대신 이 기본 가중(notable~major 사이)+인게이지먼트로 채점


email:
  enabled: true
  curation: true                # 독자층별 큐레이션(전체 리드+카테고리 B-2+킥) 생성
  logo_path: "Logo.png"         # 메일 헤더 로고 (cid 임베드)
  subject_prefix: "Morning Commit"
  # 시스템 알림(로그인 오류·수집 실패 등) 수신자 — 브리핑 수신자와 별개, 관리자만
  alert_addresses:
    - "ehhwll@hanmail.net"
  # 독자층별 발송: 페르소나(=큐레이션 대상) → 수신주소
  audiences:
    "국내 개발자":
      - "ehhwll@hanmail.net"
    "UX·프로덕트·비주얼 디자인 실무자":     # 디자이너
      - "jey.sieun@gmail.com"
    "AI 기술에 관심 많은 실무자·일반 독자":  # AI 관심
      - "dianadbwls@gmail.com"
      - "jetti0915@gmail.com"
    "국내 CS 취준생 및 주니어 개발자":
      - "ndbsrjsdn@naver.com"
  # 폴백 (audiences 비울 때만 사용 — 큐레이션 없이 중립 발송)
  to_addresses:
    - "ehhwll@hanmail.net"
    - "ndbsrjsdn@naver.com"

web:
  host: "0.0.0.0"
  port: 8000
  auto_refresh_seconds: 60

browser:
  headless: false
  profile_dir: "browser_data"
